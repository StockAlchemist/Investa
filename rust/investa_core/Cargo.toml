[package]
name = "investa_core"
version = "0.1.0"
edition = "2024"
description = "Investa's calculation core, called from the Python backend through PyO3."
publish = false

[lib]
name = "investa_core"
crate-type = ["cdylib", "rlib"]

[features]
# Enabled by maturin when building the Python extension. Left off for
# `cargo test`, which links against libpython instead.
extension-module = ["pyo3/extension-module"]

[dependencies]
num-bigint = "0.5.1"
num-integer = "0.1.47"
num-traits = "0.2.19"
numpy = "0.30.0"
pyo3 = { version = "0.30.1", features = ["abi3-py312"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# rustc's default post-link `strip -S` re-lays-out LINKEDIT and undoes the
# string-pool realignment in build-support/macos_linker.py (Xcode 27); there is
# no debug info in a release build to strip anyway.
strip = false

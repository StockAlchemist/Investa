[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "investa_core"
version = "0.1.0"
description = "Investa's calculation core, called from the Python backend through PyO3."
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[tool.maturin]
features = ["extension-module"]

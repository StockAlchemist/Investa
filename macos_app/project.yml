name: Investa
options:
  bundleIdPrefix: com.investa
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: M38ACZ9N67
targets:
  Investa:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Investa
        excludes:
          - "Info-iOS.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.investa.mac
        PRODUCT_NAME: Investa
        INFOPLIST_FILE: Investa/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        # App Sandbox is enabled with an outgoing-network entitlement so the
        # client can reach the local FastAPI backend.
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: Investa/Investa.entitlements
    entitlements:
      path: Investa/Investa.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Required for the NSOpenPanel file import (PDF/image statement parsing).
        com.apple.security.files.user-selected.read-only: true
        # Required to load Xcode's injected SwiftUI preview/debug dylibs when Hardened Runtime is enabled
        com.apple.security.cs.disable-library-validation: true
        # Required for Xcode debugger to attach to the sandboxed/hardened app
        com.apple.security.get-task-allow: true
  Investa-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Investa
        excludes:
          - "Info.plist"
          - "Investa.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.investa.ios
        PRODUCT_NAME: Investa
        # iOS can't build ad-hoc signed ("-") like the Mac target, so the
        # personal team is pinned here — otherwise regenerating the project
        # drops the signing Xcode was hand-configured with.
        CODE_SIGN_IDENTITY: "iPhone Developer"
        DEVELOPMENT_TEAM: M38ACZ9N67
        INFOPLIST_FILE: Investa/Info-iOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  InvestaTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: InvestaTests
    dependencies:
      - target: Investa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.investa.mac.tests
        PRODUCT_NAME: InvestaTests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTING_SEARCH_PATHS: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Investa.app/Contents/MacOS/Investa"
schemes:
  Investa:
    build:
      targets:
        Investa: all
        InvestaTests: [test]
    test:
      targets:
        - name: InvestaTests
    run:
      config: Debug
  Investa-iOS:
    build:
      targets:
        Investa-iOS: all
    run:
      config: Debug


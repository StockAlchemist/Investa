[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing"
# Only tests/ holds tests. Without this, a bare `pytest` walks the whole repo and
# tries to collect stray scripts that happen to be named test_*.py (e.g. one-off
# helper scripts under macos_app/).
testpaths = ["tests"]
# Resolve both application modules and repository scripts in local and CI tests.
pythonpath = [".", "src"]

[tool.mypy]
# Gradual adoption: only the files listed here are checked, and they must stay
# clean. When you touch a module, consider adding it to the list.
files = [
    "src/server/api.py",
    "src/server/auth.py",
    "src/server/dependencies.py",
    "src/server/main.py",
    "src/server/rate_limit.py",
    "src/server/response_models.py",
    "src/server/route_utils.py",
    "src/server/transaction_writes.py",
    "src/server/routes/admin.py",
    "src/server/routes/auth.py",
    "src/server/routes/buffett_rank.py",
    "src/server/routes/screener.py",
    "src/server/routes/strategies.py",
    "src/server/routes/watchlist.py",
    "src/corporate_actions.py",
    "src/portfolio_version.py",
    "src/utils_time.py",
]
mypy_path = "src"
explicit_package_bases = true
follow_imports = "silent"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# The rule set ruff selected by default through 0.12, chosen explicitly: newer
# releases select far more by default (pyupgrade, bugbear, logging, imports),
# and adopting those is its own cleanup, not part of a version bump.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Tests insert src/ into sys.path before importing project modules,
# so module-level imports necessarily follow that block.
"tests/*" = ["E402"]
